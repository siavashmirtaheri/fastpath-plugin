  <text x="520" y="28" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">hermes — fastpath</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
    <text x="40" y="95" fill="#7ee787">&gt; /fastpath</text>
    <text x="40" y="140" fill="#c9d1d9">fastpath: on · limit=12,000 chars · truncated 3 result(s) · ~54,000 chars saved (~13,500 tokens)</text>
    <text x="40" y="200" fill="#8b949e">&gt; web_extract https://example.org/docs</text>
    <rect x="36" y="222" width="1128" height="300" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="56" y="258" fill="#c9d1d9">Introduction. The quickstart covers installation and configuration…</text>
    <text x="56" y="288" fill="#c9d1d9">Authentication uses an API key stored in your environment…</text>
    <text x="56" y="318" fill="#c9d1d9">The client exposes three methods: list, get and create…</text>
    <rect x="52" y="338" width="1096" height="38" rx="6" fill="#2d1f00" stroke="#9e6a03"/>
    <text x="68" y="364" fill="#f0b429">… [fastpath omitted 68,000 chars to save context. Use a narrower query, or /fastpath limit 80000] …</text>
    <text x="56" y="420" fill="#c9d1d9">… troubleshooting section: rate limits return HTTP 429…</text>
    <text x="56" y="450" fill="#c9d1d9">See the reference page for the full parameter list.</text>
    <text x="40" y="570" fill="#8b949e">&gt; /fastpath limit 8000</text>
    <text x="40" y="612" fill="#7ee787">fastpath: limit=8,000 chars</text>
  </g>
